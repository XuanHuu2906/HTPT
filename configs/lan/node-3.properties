# ==============================================================================
# RAILWAY DISTRIBUTED SYSTEM - NHOM 6
# LAN NODE CONFIGURATION: NODE-3 (TEMPLATE WITH PLACEHOLDERS)
# Theo dac ta: docs/specs/08-DEPLOYMENT.md §3 & Task TV3-D23
# ==============================================================================
# QUY TAC AN TOAN (AGENTS.md & SPEC-08):
# 1. IP trong file nay la IP PLACEHOLDER (192.168.10.11..15 / 192.168.1.101..105).
#    TV6-D24 se thu thap IP vat ly that cua cac laptop va cap nhat khi demo.
# 2. Port Client co dinh la 9100 tren tat ca cac Laptop chay backend node.
# 3. Port Raft Peer co dinh la 9200 tren tat ca cac Laptop chay backend node.
# 4. Moi Node so huu PostgreSQL rieng (TV2 isolation). Port 5435 dung khi test
#    cung may voi compose.dev.yml; khi deploy 1 node/laptop dung 5432/5435.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DINH DANH NODE VA CUM (NODE IDENTITY & TOPOLOGY)
# ------------------------------------------------------------------------------
node.id=node-3
cluster.id=railway-demo-5

# ------------------------------------------------------------------------------
# 2. CONG MANG LANG NGHE (BIND ADDRESSES - SPEC-08 §3)
# ------------------------------------------------------------------------------
# Client-facing TCP Port (Desktop Client & Monitor ket noi tai day)
client.host=0.0.0.0
client.port=9100

# Raft Peer TCP Port (RPC giua cac Node: REQUEST_VOTE, APPEND_ENTRIES)
raft.host=0.0.0.0
raft.port=9200

# ------------------------------------------------------------------------------
# 3. DIA CHI QUANG BA PLACEHOLDER (ADVERTISE ADDRESSES - CHO TV6-D24 CAP NHAT)
# ------------------------------------------------------------------------------
node.advertise.client=192.168.10.13:9100
node.advertise.peer=192.168.10.13:9200

# Danh sach day du 5 voter trong cum Raft (Format: node-id@host:port)
node.peers=node-1@192.168.10.11:9200,node-2@192.168.10.12:9200,node-3@192.168.10.13:9200,node-4@192.168.10.14:9200,node-5@192.168.10.15:9200

# ------------------------------------------------------------------------------
# 4. KET NOI POSTGRESQL RIENG BIET (TV2 ISOLATION - SPEC-05 & SPEC-08)
# ------------------------------------------------------------------------------
db.host=localhost
db.port=5435
db.name=railway_node3
db.user=railway
db.password=railway_secret_local_only

# ------------------------------------------------------------------------------
# 5. THAM SO LUONG VA TIMEOUT NETWORKING
# ------------------------------------------------------------------------------
max.threads=32
so.timeout.ms=15000
