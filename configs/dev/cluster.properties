# ==============================================================================
# RAILWAY DISTRIBUTED SYSTEM - NHOM 6
# CAU HINH DANH BA CUM CHO MOI TRUONG DEV TAI NHA (DEV CLUSTER PROPERTIES)
# Theo dac ta: docs/specs/08-DEPLOYMENT.md §3 & Task TV6-D02
# ==============================================================================
# Muc dich:
# 1. Cung cap bang anh xa (Endpoint Resolution) tu Node ID (node-1..node-5) sang
#    dia chi IP va Port thuc te tren Windows Host cho Desktop Client va Monitor.
# 2. Ho tro Desktop Client giai ma 'leaderHint' khi nhan duoc NOT_LEADER.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. THONG SO CUM VA QUORUM (CLUSTER TOPOLOGY)
# ------------------------------------------------------------------------------
cluster.id=railway-demo-5
cluster.total-nodes=5
cluster.quorum=3
cluster.nodes=node-1,node-2,node-3,node-4,node-5

# Phien ban giao thuc Envelope TCP JSON (SPEC-03)
protocol.version=1

# ------------------------------------------------------------------------------
# 2. CLIENT ENDPOINTS (DUNG CHO DESKTOP CLIENT VA DESKTOP MONITOR TREN WINDOWS)
# Port client tren tung container (9100) duoc publish ra Windows Host: 9101..9105
# ------------------------------------------------------------------------------
node.node-1.client.host=127.0.0.1
node.node-1.client.port=9101

node.node-2.client.host=127.0.0.1
node.node-2.client.port=9102

node.node-3.client.host=127.0.0.1
node.node-3.client.port=9103

node.node-4.client.host=127.0.0.1
node.node-4.client.port=9104

node.node-5.client.host=127.0.0.1
node.node-5.client.port=9105

# ------------------------------------------------------------------------------
# 3. PEER RAFT ENDPOINTS (HOST PUBLISHED PORTS CHO MUC DICH DEBUG / MONITOR)
# Luu y: Giao tiep Raft giua cac container dung internal 9200 qua Docker bridge.
# Cac port 9201..9205 duoc publish ra host chi phuc vu debug hoac test harness tu host.
# ------------------------------------------------------------------------------
node.node-1.peer.host=127.0.0.1
node.node-1.peer.port=9201

node.node-2.peer.host=127.0.0.1
node.node-2.peer.port=9202

node.node-3.peer.host=127.0.0.1
node.node-3.peer.port=9203

node.node-4.peer.host=127.0.0.1
node.node-4.peer.port=9204

node.node-5.peer.host=127.0.0.1
node.node-5.peer.port=9205

# ------------------------------------------------------------------------------
# 4. CHINH SACH KET NOI VA RETRY CUA CLIENT (SPEC-06 §4 & SPEC-08 §3.1)
# Don vi: milliseconds (ms)
# ------------------------------------------------------------------------------
# Timeout thiet lap ket noi TCP ban dau
client.connect-timeout-ms=2000

# Deadline cho mot yeu cau (GET_SEATS, BOOK_TICKET,...)
client.request-timeout-ms=5000

# So lan thu lai toi da khi mat ket noi hoac chuyen huong Leader
client.retry.max-attempts=3

# Khoang thoi gian cho giua cac lan retry (Exponential backoff base)
client.retry.backoff-ms=500

# ------------------------------------------------------------------------------
# 5. CHINH SACH GIAM SAT CUA DESKTOP MONITOR (SPEC-06 §7 & SPEC-03 §5)
# ------------------------------------------------------------------------------
# Chu ky goi NODE_STATUS de cap nhat giao dien Monitor
monitor.poll-interval-ms=1000

# Timeout cho moi request chẩn doan NODE_STATUS
monitor.request-timeout-ms=1500
