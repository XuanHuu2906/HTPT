# ==============================================================================
# RAILWAY DISTRIBUTED SYSTEM - NHOM 6
# CAU HINH CLIENT KET NOI CUM 5 NODE (TASK TV1-D16)
# Theo dac ta: docs/specs/08-DEPLOYMENT.md §3, configs/dev/cluster.properties (TV6-D02)
#              va configs/lan/node-1.properties (TV3-D08)
# ==============================================================================
# QUY TAC BAT BUOC (AGENTS.md & SPEC-08):
# 1. KHONG HARDCODE LEADER: Raft bau cu dong, Leader chi duoc biet qua phan hoi
#    (leaderHint hoac NODE_STATUS_RESPONSE). Tuyet doi khong co truong "leader".
# 2. PROFILE DEV CHO WINDOWS HOST: Dung 127.0.0.1 thay vi 'localhost' de tranh
#    tre phan giai IPv6 tren Windows; ket noi cac port 9101..9105 do Docker publish.
# 3. PROFILE LAN: IP placeholder co chu thich ro rang, cho TV3/TV6 chot dia chi
#    that khi rap mang LAN 6 laptop.
# 4. THU TU UU TIEN: System property (-D) > Env var > file client.properties ngoai
#    (thu muc lam viec) > classpath (/config/client.properties).
# ==============================================================================

# Ho so ket noi dang kich hoat (dev hoac lan)
cluster.profile=dev

# Chien luoc lua chon Node ket noi ban dau: RANDOM | ROUND_ROBIN | PREFERRED_FIRST
client.selectionStrategy=ROUND_ROBIN

# Node uu tien ket noi dau tien (nodeId hop le, de trong neu khong uu tien)
client.preferredNode=

# Thoi gian timeout thiet lap ket noi TCP ban dau (ms)
client.connectTimeoutMs=2000

# Thoi gian deadline cho mot yeu cau doc/ghi TCP (ms)
client.readTimeoutMs=5000

# So lan chuyen huong Leader toi da (SPEC-03 §4)
client.maxRedirects=3

# Thoi gian danh dau Node loi tam thoi (cooldown ms) truoc khi thu lai
client.failureCooldownMs=15000

# ==============================================================================
# 1. PROFILE DEV: 5 Node tren Docker Desktop Windows Host
# Anh xa port host 9101..9105 vao port client 9100 cua tung container backend
# ==============================================================================
dev.cluster.nodes=node-1,node-2,node-3,node-4,node-5

dev.node.node-1.client.host=127.0.0.1
dev.node.node-1.client.port=9101

dev.node.node-2.client.host=127.0.0.1
dev.node.node-2.client.port=9102

dev.node.node-3.client.host=127.0.0.1
dev.node.node-3.client.port=9103

dev.node.node-4.client.host=127.0.0.1
dev.node.node-4.client.port=9104

dev.node.node-5.client.host=127.0.0.1
dev.node.node-5.client.port=9105

# ==============================================================================
# 2. PROFILE LAN: 5 Node tren 5 Laptop rieng biet trong mang LAN vat ly
# LUU Y: Cung port 9100 tren moi Laptop. IP duoi day la PLACEHOLDER (CHO TV3/TV6 CHOT).
# Khong commit dia chi IP that cua laptop thanh vien len git.
# ==============================================================================
lan.cluster.nodes=node-1,node-2,node-3,node-4,node-5

# CHO TV3/TV6 CHOT: IP cua Laptop 1 (chay backend-node-1)
lan.node.node-1.client.host=192.168.1.101
lan.node.node-1.client.port=9100

# CHO TV3/TV6 CHOT: IP cua Laptop 2 (chay backend-node-2)
lan.node.node-2.client.host=192.168.1.102
lan.node.node-2.client.port=9100

# CHO TV3/TV6 CHOT: IP cua Laptop 3 (chay backend-node-3)
lan.node.node-3.client.host=192.168.1.103
lan.node.node-3.client.port=9100

# CHO TV3/TV6 CHOT: IP cua Laptop 4 (chay backend-node-4)
lan.node.node-4.client.host=192.168.1.104
lan.node.node-4.client.port=9100

# CHO TV3/TV6 CHOT: IP cua Laptop 5 (chay backend-node-5)
lan.node.node-5.client.host=192.168.1.105
lan.node.node-5.client.port=9100
