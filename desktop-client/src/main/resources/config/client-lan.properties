# ==============================================================================
# RAILWAY DISTRIBUTED SYSTEM - NHOM 6
# CAU HINH CLIENT KET NOI CUM 5 NODE CHO MANG LAN (TASK TV1-D25)
# Theo dac ta: docs/specs/08-DEPLOYMENT.md §3, configs/lan/PORTS.md va configs/lan/node-1..5.properties
# TRANG THAI: CHƯA CÓ INVENTORY THẬT — placeholder cho TV6-D24
# ==============================================================================
# QUY TAC BAT BUOC (AGENTS.md & SPEC-08):
# 1. KHONG HARDCODE LEADER: Leader duoc phat hien dong qua phan hoi hoac NODE_STATUS.
# 2. CONG CLIENT DONG NHAT 9100 tren tat ca 5 laptop voter.
#    Client TUYET DOI KHONG ket noi vao cong Raft 9200.
# 3. IP DUOI DAY LA PLACEHOLDER: TV6-D24 se cap nhat khi tap trung rap mang LAN.
#    ClientConfig se tu choi ket noi vao IP placeholder khi chay o che do that.
# ==============================================================================

# Ho so ket noi: LAN
cluster.profile=lan

# Che do van hanh cua Client: socket (ket noi cum 5 Node) hoac mock (gia lap UI)
client.mode=socket

# Chien luoc lua chon Node ket noi ban dau: RANDOM | ROUND_ROBIN | PREFERRED_FIRST
client.selectionStrategy=ROUND_ROBIN

# Node uu tien ket noi dau tien (de trong neu khong uu tien)
client.preferredNode=

# Thoi gian timeout thiet lap ket noi TCP ban dau (ms)
client.connectTimeoutMs=2000

# Thoi gian deadline cho mot yeu cau doc/ghi TCP (ms)
client.readTimeoutMs=5000

# So lan chuyen huong Leader toi da (SPEC-03 §4)
client.maxRedirects=3

# Thoi gian danh dau Node loi tam thoi (cooldown ms) truoc khi thu lai
client.failureCooldownMs=15000

# ==============================================================================
# DANH SACH 5 NODE TRONG CUM LAN (VOTER 1..5)
# Client Port co dinh: 9100. Host la IP placeholder mau tu configs/lan/PORTS.md.
# ==============================================================================
lan.cluster.nodes=node-1,node-2,node-3,node-4,node-5

# Laptop 1 (node-1 voter): CHƯA CÓ INVENTORY THẬT — placeholder
lan.node.node-1.client.host=192.168.1.101
lan.node.node-1.client.port=9100

