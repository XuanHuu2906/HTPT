# TV6-D25 / SPEC-08: run THIS file once on each laptop 1..5.
# Laptop 6 only runs JavaFX Client/Monitor; it is not a sixth voter.
# Set a local ignored env file per machine (never commit its password):
#   NODE_ID=node-N                 N=1..5, matching the physical laptop
#   LAN_IP=<measured local IPv4>   no template/VMware/APIPA addresses
#   NODE_PEERS=<same complete node-1@IP1:9200,...,node-5@IP5:9200 on all hosts>
#   DB_NAME=railway_nodeN
#   DB_PASSWORD=<local demo password>
#   BACKEND_IMAGE=<same frozen tag/digest loaded on all five hosts>
#   POSTGRES_IMAGE=postgres:16-alpine  (baseline; freeze its image ID too)
# From repository root, on each corresponding laptop:
#   docker compose --env-file <local.env> -f docker/lan.yml config --quiet
#   docker compose --env-file <local.env> -f docker/lan.yml up -d --wait --wait-timeout 90
#   docker compose --env-file <local.env> -f docker/lan.yml ps -a
#   docker compose --env-file <local.env> -f docker/lan.yml logs --no-color --timestamps --tail 200
# Log each command's actual exit code before moving to the next laptop.
# Images must already be built/loaded: no implicit pull/build during offline demo.
# Volumes are per project/node; preserve project name, NODE_ID and DB settings
# on restart/recovery. Migrations/seed run ONLY on a new PG volume; never reseed
# a returning node. Do not use down -v. Initializing a new cluster is coordinated.
# Backend health means local TCP listeners only, NOT quorum/Leader/G6 PASS.
# Review host firewall scopes: 9100 for Clients, 9200 only the five voter hosts.

name: railway-lan-${NODE_ID:?Set NODE_ID to the assigned node-1..node-5}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME to railway_nodeN matching NODE_ID}
      POSTGRES_USER: ${DB_USER:-railway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD outside Git}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ../database/migration
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    # No host database port: only this backend connects over the private bridge.
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:?Set the frozen backend image loaded on all five hosts}
    pull_policy: never
    restart: unless-stopped
    # Call the real runtime directly: startup errors must not fall back to tail.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$NODE_ID" in node-[1-5]) ;; *) echo 'Invalid NODE_ID' >&2; exit 2;; esac
        expected_db="railway_node$${NODE_ID#node-}"
        [ "$$DB_NAME" = "$$expected_db" ] || { echo 'DB_NAME must match NODE_ID' >&2; exit 2; }
        set -f
        saved_ifs=$$IFS
        IFS=,
        set -- $$NODE_PEERS
        IFS=$$saved_ifs
        [ "$$#" -eq 5 ] || { echo 'NODE_PEERS must contain five voters' >&2; exit 2; }
        for id in node-1 node-2 node-3 node-4 node-5; do
          matches=0
          for peer do
            case "$$peer" in "$$id"@?*:9200) matches=$$((matches + 1));; esac
          done
          [ "$$matches" -eq 1 ] || { echo 'NODE_PEERS IDs/ports invalid' >&2; exit 2; }
        done
        case ",$$NODE_PEERS," in *",$$NODE_ID@$$LAN_IP:9200,"*) ;; *) echo 'Self peer must match LAN_IP' >&2; exit 2;; esac
        exec java -cp '/app/backend-node.jar:/app/lib/*' vn.nhom6.railway.node.NodeMain
    environment:
      NODE_ID: ${NODE_ID:?Set NODE_ID to the assigned node-1..node-5}
      LAN_IP: ${LAN_IP:?Set this laptop's measured LAN IPv4}
      CLUSTER_ID: ${CLUSTER_ID:-railway-demo-5}
      NODE_CLIENT_BIND: 0.0.0.0:9100
      NODE_PEER_BIND: 0.0.0.0:9200
      NODE_ADVERTISE_CLIENT: ${LAN_IP:?Set this laptop's measured LAN IPv4}:9100
      NODE_ADVERTISE_PEER: ${LAN_IP:?Set this laptop's measured LAN IPv4}:9200
      NODE_PEERS: ${NODE_PEERS:?Set the same complete five-voter LAN peer map on every host}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME to railway_nodeN matching NODE_ID}
      DB_USER: ${DB_USER:-railway}
      DB_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD outside Git}
      RAFT_ELECTION_TIMEOUT_MIN_MS: ${RAFT_ELECTION_TIMEOUT_MIN_MS:-500}
      RAFT_ELECTION_TIMEOUT_MAX_MS: ${RAFT_ELECTION_TIMEOUT_MAX_MS:-1000}
      RAFT_HEARTBEAT_INTERVAL_MS: ${RAFT_HEARTBEAT_INTERVAL_MS:-150}
      TCP_CONNECT_TIMEOUT_MS: ${TCP_CONNECT_TIMEOUT_MS:-1000}
      TCP_RESPONSE_DEADLINE_MS: ${TCP_RESPONSE_DEADLINE_MS:-3000}
    ports:
      - "${LAN_IP:?Set this laptop's measured LAN IPv4}:9100:9100/tcp"
      - "${LAN_IP:?Set this laptop's measured LAN IPv4}:9200:9200/tcp"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - lan
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 9100 && nc -z -w 2 127.0.0.1 9200"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  database:
    internal: true
  lan:
    driver: bridge

volumes:
  pgdata:
