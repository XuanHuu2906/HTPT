# ==============================================================================
# RAILWAY DISTRIBUTED SYSTEM - NHOM 6
# DOCKER COMPOSE CHO MOI TRUONG DEV (5 POSTGRESQL INSTANCES DOC LAP)
# Theo dac ta: docs/specs/08-DEPLOYMENT.md, docs/specs/05-BOOKING-DATABASE.md,
#              docs/DATABASE.md §2 va Task TV6 (DevOps / Docker)
# ==============================================================================
# QUY TAC BAT BUOC (SAFETY INVARIANTS):
# 1. TUYET DOI KHONG DUNG DATABASE CHUNG: Moi Backend Node phai co 1 PostgreSQL
#    instance rieng biet va 1 volume doc lap (pgdata1..pgdata5).
# 2. HEALTHCHECK: Su dung 'pg_isready' chuan theo SPEC-08, khong dung HTTP health.
# 3. MANG NOI BO & HOST PORTS:
#    - Noi bo Docker bridge (railway-net): cac container deu dung port mac dinh 5432.
#    - Host ports publish ra Windows: 5433..5437 (tranh xung dot port 5432 goc).
# 4. DOC LAP VOI TV2-D04: Compose khoi tao DBMS san sang; khong bi rang buoc
#    khi TV2 chua ban giao xong file SQL migration o D04.
# ==============================================================================

networks:
  railway-net:
    name: railway-dev-network
    driver: bridge

volumes:
  pgdata1:
    name: railway_pgdata1
  pgdata2:
    name: railway_pgdata2
  pgdata3:
    name: railway_pgdata3
  pgdata4:
    name: railway_pgdata4
  pgdata5:
    name: railway_pgdata5

services:
  # ----------------------------------------------------------------------------
  # POSTGRESQL INSTANCE 1 (NODE-1)
  # ----------------------------------------------------------------------------
  postgres-1:
    image: postgres:16-alpine
    container_name: railway-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG1_DB:-railway_node1}
      POSTGRES_USER: ${PG1_USER:-railway}
      POSTGRES_PASSWORD: ${PG1_PASSWORD:-railway_secret_local_only}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata1:/var/lib/postgresql/data
    ports:
      - "${PG1_PORT:-5433}:5432"
    networks:
      railway-net:
        aliases:
          - pg1
          - postgres-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG1_USER:-railway} -d ${PG1_DB:-railway_node1}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # POSTGRESQL INSTANCE 2 (NODE-2)
  # ----------------------------------------------------------------------------
  postgres-2:
    image: postgres:16-alpine
