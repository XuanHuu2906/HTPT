    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG5_USER:-railway} -d ${PG5_DB:-railway_node5}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 5 BACKEND NODE SERVICES (CUNG IMAGE, KHAC NODE_ID, PEERS, VA DATABASE)
  # Profile: 'nodes' (hoac 'backend', 'all'). Chay 'docker compose up -d' chi khoi
  # dong 5 DB; chay 'docker compose --profile nodes up -d' khoi dong ca 5 Nodes.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # BACKEND NODE 1
  # ----------------------------------------------------------------------------
  backend-node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: railway-backend-node:dev
    container_name: railway-backend-node-1
    restart: unless-stopped
    profiles:
      - nodes
      - backend
      - all
    environment:
      NODE_ID: node-1
      CLUSTER_ID: ${CLUSTER_ID:-railway-demo-5}
      NODE_CLIENT_BIND: 0.0.0.0:9100
      NODE_PEER_BIND: 0.0.0.0:9200
      NODE_ADVERTISE_CLIENT: 127.0.0.1:9101
      NODE_ADVERTISE_PEER: backend-node-1:9200
      NODE_PEERS: node-1@backend-node-1:9200,node-2@backend-node-2:9200,node-3@backend-node-3:9200,node-4@backend-node-4:9200,node-5@backend-node-5:9200
      DB_HOST: postgres-1
      DB_PORT: 5432
      DB_NAME: ${PG1_DB:-railway_node1}
      DB_USER: ${PG1_USER:-railway}
      DB_PASSWORD: ${PG1_PASSWORD:-railway_secret_local_only}
      RAFT_ELECTION_TIMEOUT_MIN_MS: ${RAFT_ELECTION_TIMEOUT_MIN_MS:-150}
      RAFT_ELECTION_TIMEOUT_MAX_MS: ${RAFT_ELECTION_TIMEOUT_MAX_MS:-300}
      RAFT_HEARTBEAT_INTERVAL_MS: ${RAFT_HEARTBEAT_INTERVAL_MS:-50}
      TCP_CONNECT_TIMEOUT_MS: ${TCP_CONNECT_TIMEOUT_MS:-1000}
      TCP_RESPONSE_DEADLINE_MS: ${TCP_RESPONSE_DEADLINE_MS:-3000}
    ports:
      - "${NODE1_CLIENT_PORT:-9101}:9100"
      - "${NODE1_PEER_PORT:-9201}:9200"
    depends_on:
      postgres-1:
        condition: service_healthy
    networks:
      railway-net:
        aliases:
          - backend-node1
          - node-1
          - backend-node-1

