      POSTGRES_USER: ${PG5_USER:-railway}
      POSTGRES_PASSWORD: ${PG5_PASSWORD:-railway_secret_local_only}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata5:/var/lib/postgresql/data
      - ../database/migration:/docker-entrypoint-initdb.d:ro
    ports:
