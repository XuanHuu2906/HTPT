    volumes:
      - pgdata3:/var/lib/postgresql/data
      - ../database/migration:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG3_PORT:-5435}:5432"
    networks:
      railway-net:
        aliases:
          - pg3
          - postgres-3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG3_USER:-railway} -d ${PG3_DB:-railway_node3}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

