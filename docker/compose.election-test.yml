# Isolated disposable election fixture: five real Backend processes and five PostgreSQLs.
# Run via scripts/test-election-docker.py; never shares dev volumes.
services:
  pg-1:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: railway_test
      POSTGRES_PASSWORD: ${ELECTION_TEST_DB_PASSWORD:?Set an ephemeral test password}
      POSTGRES_DB: railway_node1
    volumes:
      - ../database/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway_test -d railway_node1"]
      interval: 1s
      timeout: 3s
      retries: 30
  node-1:
    image: railway-backend-node:d13-election
    environment:
      NODE_ID: node-1
      NODE_CLIENT_BIND: 0.0.0.0:9100
      NODE_PEER_BIND: 0.0.0.0:9200
      NODE_PEERS: node-1@node-1:9200,node-2@node-2:9200,node-3@node-3:9200,node-4@node-4:9200,node-5@node-5:9200
      DB_HOST: pg-1
      DB_PORT: 5432
      DB_NAME: railway_node1
      DB_USER: railway_test
      DB_PASSWORD: ${ELECTION_TEST_DB_PASSWORD:?Set an ephemeral test password}
      RAFT_HEARTBEAT_INTERVAL_MS: 150
      RAFT_ELECTION_TIMEOUT_MIN_MS: 700
      RAFT_ELECTION_TIMEOUT_MAX_MS: 1400
      TCP_CONNECT_TIMEOUT_MS: 250
      TCP_RESPONSE_DEADLINE_MS: 500
    ports:
      - "127.0.0.1:19101:9100"
      - "127.0.0.1:19201:9200"
    depends_on:
      pg-1:
        condition: service_healthy
  pg-2:
